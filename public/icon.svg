<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="English4us">
  <!-- Icone de l'application.
       Refaite le 17/08/2026 : elle portait encore l'indigo #4338ca de
       l'ancienne palette, abandonnee lors de la refonte. Elle reprend
       desormais le degrade bleu de la marque et les couleurs exactes de
       la mascotte, definies dans styles.css. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#4276c8"/>
      <stop offset="1" stop-color="#2f57a8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#brand)"/>

  <g transform="translate(106 124) scale(1.5)">
    <!-- Oreilles -->
    <ellipse cx="46" cy="76" rx="38" ry="45" fill="#7f86b3"/>
    <ellipse cx="52" cy="78" rx="19" ry="24" fill="#dda9bb"/>
    <ellipse cx="154" cy="76" rx="38" ry="45" fill="#7f86b3"/>
    <ellipse cx="148" cy="78" rx="19" ry="24" fill="#dda9bb"/>

    <!-- Tete et trompe -->
    <ellipse cx="100" cy="82" rx="54" ry="56" fill="#9aa0c8"/>
    <path d="M100 112 C 100 136, 90 148, 95 163" stroke="#9aa0c8" stroke-width="26" stroke-linecap="round" fill="none"/>

    <!-- Defenses -->
    <path d="M74 116 q -7 14 -2 22" stroke="#FFF9EC" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M126 116 q 7 14 2 22" stroke="#FFF9EC" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Yeux -->
    <circle cx="79" cy="72" r="12" fill="#fff"/><circle cx="80" cy="73" r="6" fill="#14161a"/>
    <circle cx="121" cy="72" r="12" fill="#fff"/><circle cx="122" cy="73" r="6" fill="#14161a"/>
  </g>
</svg>
